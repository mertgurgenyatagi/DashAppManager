name: Build and publish (Windows)

on:
  push:
    branches: [ dockerization-take-two, development, main ]
  workflow_dispatch:

jobs:
  publish:
    name: Publish WPF app (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Locate WPF project
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path $PWD -Recurse -Filter '*WPF*.csproj' | Select-Object -First 1
          if (-not $proj) { Write-Error 'WPF project not found'; exit 1 }
          Write-Output "Found project: $($proj.FullName)"
          echo "WPF_PROJECT=$($proj.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish (self-contained single-file, win-x64)
        shell: pwsh
        run: |
          dotnet publish "$env:WPF_PROJECT" -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -o "$PWD/publish"

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: spm-wpf-publish
          path: publish/
